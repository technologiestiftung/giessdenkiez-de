name: E2E Tests
permissions:
  contents: write
  packages: write
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-tests:
    if: github.actor != 'renovate[bot]'
    timeout-minutes: 15
    # One job per browser: the four projects used to run one after the other in
    # a single job. fail-fast is off so one broken browser doesn't hide the rest.
    # `engine` is the browser binary to install, `slug` names the artifact
    # (artifact names must not contain spaces).
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            engine: chromium
            slug: chromium
          - browser: webkit
            engine: webkit
            slug: webkit
          - browser: Mobile Chrome
            engine: chromium
            slug: mobile-chrome
          - browser: Mobile Safari
            engine: webkit
            slug: mobile-safari
    env:
      CI: true
      ESLINT_USE_FLAT_CONFIG: true
      SUPABASE_URL: http://localhost:54321
      VITE_PORT: 5173
      VITE_BASE_URL: http://localhost:5173
      VITE_RECOVERY_AUTH_REDIRECT_URL: http://localhost:5173/profile/reset-password
      VITE_SUPABASE_URL: http://localhost:54321
      TEST_SUPABASE_INBUCKET_URL: http://localhost:54324
      # The values below are taken from the command `supabase start`
      # WARNING: Don't use production URLs or tokens here
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      TEST_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      VITE_MATOMO_SITE_ID: ""
      VITE_MATOMO_URL: ""
      VITE_MAP_BOUNDING_BOX: "13.0824446341071,52.3281202651866,13.7682544186827,52.681600197973"
      VITE_MAP_CENTER_LNG: "13.388836926491992"
      VITE_MAP_CENTER_LAT: "52.494590307846366"
      VITE_MAPBOX_API_ENDPOINT: "https://api.mapbox.com"
      VITE_MAP_PITCH_DEGREES: "45"
      VITE_MAP_MAX_ZOOM_LEVEL: "20"
      VITE_MAP_MIN_ZOOM_LEVEL: "10"
      VITE_MAP_INITIAL_ZOOM_LEVEL: "11"
      VITE_MAP_LOCATION_ZOOM_LEVEL: "17"
      VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
      VITE_MAPBOX_STYLE_URL: ${{ secrets.VITE_MAPBOX_STYLE_URL }}
      VITE_MAPBOX_TREES_TILESET_URL: ${{ secrets.VITE_MAPBOX_TREES_TILESET_URL }}
      VITE_MAPBOX_TREES_TILESET_LAYER: ${{ secrets.VITE_MAPBOX_TREES_TILESET_LAYER }}
      VITE_MAP_PUMPS_SOURCE_URL: ${{ secrets.VITE_MAP_PUMPS_SOURCE_URL }}
      VITE_PW_TEST: "true"

      SUPABASE_MAX_ROWS: 10000
      # Set to scheme, domain and possibly port (if something else than port 80) of the origin you are expecting
      # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Origin
      ACCESS_CONTROL_ALLOW_ORIGIN: "*"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks

      - name: Setup Node.js using .nvmrc ⚙️
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, pinned to commit sha to avoid sha-hulud like attacks
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup tmate session so you can ssh into the workflow machine ⚙️
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
        # please see https://github.com/mxschmitt/action-tmate

      - name: Cache npm dependencies 💾
        id: cache-npm-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, pinned to commit sha to avoid sha-hulud like attacks
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies 📦
        if: steps.cache-npm-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check Build 🏗️
        run: npm run build

      - name: Get the source for the api ⬇️
        id: checkout-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks
        with:
          repository: technologiestiftung/giessdenkiez-de-postgres-api
          ref: "staging"
          path: api

      - name: Install Supabase CLI ⚙️
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0, pinned to commit sha to avoid sha-hulud like attacks
        with:
          version: 2.110.0

      - name: Start supabase ⚡️
        shell: bash
        working-directory: api
        run: |
          npm ci
          # Run supabase start in the background with nohup so it survives the
          # GitHub Actions step closing its stdout/stderr. Redirect output to a log
          # file so we can inspect it if the wait action times out.
          nohup supabase start --exclude studio,realtime,imgproxy,edge-runtime,supavisor,postgres-meta,storage,logflare,vector > /tmp/supabase-start.log 2>&1 &
          echo $! > /tmp/supabase-start.pid

          # Fail fast if the process died immediately (e.g. config error). If it is already
          # gone we cannot tell success from failure by existence alone, so reap it with `wait`
          # to read the real exit status: a clean exit just means the stack was already up.
          sleep 2
          SUPABASE_PID="$(cat /tmp/supabase-start.pid)"
          if ! kill -0 "$SUPABASE_PID" 2>/dev/null; then
            if wait "$SUPABASE_PID"; then
              echo "supabase start already finished successfully:"
              cat /tmp/supabase-start.log
            else
              echo "supabase start exited immediately with status $?:"
              cat /tmp/supabase-start.log
              exit 1
            fi
          fi

      - name: Install Playwright Browser 🧭
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Wait for Supabase to be ready ⏳
        shell: bash
        run: |
          timeout=600
          deadline=$((SECONDS + timeout))

          # Sometimes the postgrest api and postgres are up, but individual postgrest endpoints are not ready yet.
          # Therefore we check that a real table (e.g. `profiles`) is queryable, not just the
          # PostgREST root/OpenAPI endpoint — the root answers even when table privileges are missing,
          # which lets a broken stack look healthy here and only fail several steps later.


          until \
          HTTP_STATUS=$(curl -s --connect-timeout 5 --max-time 10 -o /tmp/supabase-health.body -w "%{http_code}" \
          -H "apikey: $SUPABASE_ANON_KEY" http://localhost:54321/rest/v1/profiles) && \
          [ "$HTTP_STATUS" = "200" ] && \
          pg_isready -U postgres -h localhost -p 54322 >/tmp/pg_isready.out 2>&1; do
          if [ "$SECONDS" -ge "$deadline" ]; then
           echo "Timed out waiting for Supabase after ${SECONDS}s (limit ${timeout}s)"
           echo "=== PostgREST health check (http://localhost:54321/rest/v1/profiles) ==="
           echo "HTTP status: ${HTTP_STATUS:-<failed>}"
           if [ -f /tmp/supabase-health.body ]; then
             echo "Response body (first 500 chars):"
             head -c 500 /tmp/supabase-health.body || true
             echo
           fi
           echo "=== PostgreSQL readiness (pg_isready -U postgres -h localhost -p 54322) ==="
           cat /tmp/pg_isready.out 2>/dev/null || echo "pg_isready output unavailable"
           if command -v docker >/dev/null 2>&1; then
             echo "=== Docker status (running) ==="
             docker ps
             echo "=== Docker status (all) ==="
             docker ps -a
           fi
           if [ -f /tmp/supabase-start.log ]; then
             echo "=== Supabase start log ==="
             cat /tmp/supabase-start.log
             echo "=== End Supabase start log ==="
           fi
           exit 1
          fi
          echo "Waiting for Supabase to be ready... (${SECONDS}s/${timeout}s, POSTGREST status: ${HTTP_STATUS:-<failed>})"
          sleep 1
          done
          echo "Supabase is ready!"

      - name: Run E2E test 🎭
        run: npm run test:e2e -- --project="${{ matrix.browser }}"

      - name: Upload E2E test results ⬆️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-e2e-test-results-${{ matrix.slug }}
          path: test-results
          retention-days: 30

      # Only on a manual debug run: with the browser matrix this would otherwise
      # hold four jobs open for 15 minutes each on every failure.
      - name: Start Tmate session 🔌
        if: ${{ failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24, pinned to commit sha to avoid sha-hulud like attacks
        timeout-minutes: 15
        with:
          limit-access-to-actor: true
